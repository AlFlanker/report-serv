name: report-serv

x-app-image: &app-image
  image: report-serv:local
  build:
    context: .

x-s3-environment: &s3-environment
  S3_ENDPOINT: http://s3:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-reports}
  S3_FORCE_PATH_STYLE: "true"
  S3_PREFIX: ${S3_PREFIX:-reports/}
  S3_PART_SIZE_MIB: ${S3_PART_SIZE_MIB:-8}
  S3_UPLOAD_CONCURRENCY: ${S3_UPLOAD_CONCURRENCY:-2}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Run node scripts/setup-local-s3.mjs first}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Run node scripts/setup-local-s3.mjs first}

services:
  postgres:
    image: postgres@sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reports}
      POSTGRES_DB: ${POSTGRES_DB:-reports}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local-postgres.mjs first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command:
      - mini
      - -dir=/data
      - -ip=s3
      - -ip.bind=0.0.0.0
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3-iam.json
      - -s3.autoCreateBucket=false
      - -s3.iam=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
      - -admin.ui=false
      - -webdav=false
      - -master.telemetry=false
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3-data:/data
      - ./.data/s3-iam.json:/etc/seaweedfs/s3-iam.json:ro
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "127.0.0.1", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  s3-init:
    image: report-serv:local
    pull_policy: never
    profiles: [app]
    command: ["node", "scripts/init-s3.mjs"]
    environment: *s3-environment
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    profiles: [app]
    environment:
      <<: *s3-environment
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Run node scripts/setup-local-postgres.mjs first}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      SEED_DEMO: ${SEED_DEMO:-true}
      MAX_PERIOD_DAYS: ${MAX_PERIOD_DAYS:-31}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  s3-data:
  postgres-data:
  # Retain the previous SQLite volume for explicit migration/backup only.
  app-data:
